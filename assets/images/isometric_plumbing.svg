<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="100%" height="100%">
  <defs>
    <linearGradient id="isoGradSlab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="isoGradTank" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="isoGradCopper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="isoGradPex" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="isoGradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="isoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ground Isometric Slab -->
  <g filter="url(#isoShadow)">
    <!-- Base Platform Top Face -->
    <path d="M 260 80 L 470 190 L 260 300 L 50 190 Z" fill="url(#isoGradSlab)" stroke="#94A3B8" stroke-width="2"/>
    <!-- Base Platform Left Face -->
    <path d="M 50 190 L 260 300 L 260 340 L 50 230 Z" fill="#94A3B8"/>
    <!-- Base Platform Right Face -->
    <path d="M 260 300 L 470 190 L 470 230 L 260 340 Z" fill="#64748B"/>
  </g>

  <!-- Isometric Grid Lines on Slab -->
  <path d="M 102 162 L 312 272 M 155 135 L 365 245 M 207 107 L 417 217" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 417 162 L 207 272 M 365 135 L 155 245 M 312 107 L 102 217" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Isometric Water Heater Cylinder -->
  <g transform="translate(220, 110)">
    <!-- Tank Body -->
    <rect x="0" y="40" width="70" height="110" rx="35" fill="url(#isoGradTank)" stroke="#475569" stroke-width="1.5"/>
    <!-- Tank Top Cap -->
    <ellipse cx="35" cy="40" rx="35" ry="14" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
    <!-- Temperature Gauge -->
    <circle cx="35" cy="85" r="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <line x1="35" y1="85" x2="41" y2="80" stroke="#FF5500" stroke-width="2" stroke-linecap="round"/>
    <circle cx="35" cy="85" r="2" fill="#0F172A"/>
    <!-- Expansion Tank on Top -->
    <rect x="23" y="0" width="24" height="30" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="35" cy="0" rx="12" ry="5" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
  </g>

  <!-- PEX & Copper Pipeline Manifold (3D Tracing) -->
  <!-- Hot Water (Copper) -->
  <path d="M 235 150 L 235 90 L 160 50 L 160 170 L 120 190" fill="none" stroke="url(#isoGradCopper)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hot Line Valves -->
  <circle cx="160" cy="110" r="6" fill="#FF5500" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Cold Water (Blue PEX) -->
  <path d="M 275 150 L 275 80 L 370 130 L 370 210 L 330 230" fill="none" stroke="url(#isoGradPex)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cold Line Valves -->
  <circle cx="370" cy="150" r="6" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Main Waste Drain Stack (White PVC with Purple Primer Bands) -->
  <g>
    <!-- Vertical Stack -->
    <rect x="180" y="140" width="16" height="110" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <!-- Primer Joint -->
    <rect x="178" y="180" width="20" height="8" rx="2" fill="#9333EA" opacity="0.4"/>
    <rect x="176" y="182" width="24" height="6" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
    <!-- Sanitary Wye Junction -->
    <path d="M 196 210 L 240 230 L 240 242 L 196 222 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <!-- Cleanout Plug -->
    <circle cx="188" cy="150" r="6" fill="#FF5500"/>
    <rect x="186" y="146" width="4" height="8" fill="#FFFFFF"/>
  </g>

  <!-- Isometric Red Pipe Wrench (Brand Tool) -->
  <g transform="translate(320, 240) rotate(-28)">
    <rect x="0" y="0" width="90" height="14" rx="4" fill="url(#isoGradOrange)"/>
    <path d="M 90 -4 L 115 -4 L 115 18 L 90 18 Z" fill="#334155"/>
    <path d="M 100 -12 L 125 -12 L 125 -4 L 100 -4 Z" fill="#475569"/>
    <!-- Hook Jaw -->
    <path d="M 125 -12 L 125 10 L 115 10" fill="none" stroke="#64748B" stroke-width="4"/>
  </g>

  <!-- Floating Quality Badge / Seal -->
  <g transform="translate(380, 50)" filter="url(#isoShadow)">
    <circle cx="45" cy="45" r="40" fill="#162035" stroke="#FF5500" stroke-width="3"/>
    <circle cx="45" cy="45" r="33" fill="none" stroke="rgba(255,255,255,0.2)" stroke-dasharray="3,3"/>
    <text x="45" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">100%</text>
    <text x="45" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#FF5500" text-anchor="middle">CERTIFIED</text>
  </g>
</svg>
